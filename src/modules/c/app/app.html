<template lwc:render-mode="light">
    <div class="slds-m-around_large">
        <lightning-card variant="base" title="Electron + LWC + Salesforce" icon-name="standard:account">
            <div class="slds-p-horizontal_small">
                <template lwc:if={errorMessage}>
                    <div class="slds-notify slds-notify_alert slds-alert_error slds-m-bottom_small" role="alert">
                        <span class="slds-assistive-text">error</span>
                        <h2>{errorMessage}</h2>
                    </div>
                </template>

                <p class="slds-m-bottom_small">
                    Status:
                    <template lwc:if={connected}>
                        <strong class="slds-m-left_small">Signed in</strong>
                    </template>
                    <template lwc:else>
                        <strong class="slds-m-left_small">Not signed in</strong>
                    </template>
                </p>

                <template lwc:if={connected}>
                    <p class="slds-text-body_small slds-m-bottom_x-small">User Id: {userId}</p>
                    <p class="slds-text-body_small slds-m-bottom_x-small">Org Id: {orgId}</p>
                    <p class="slds-text-body_small slds-m-bottom_small">Instance: {instanceUrl}</p>
                </template>

                <div class="slds-m-top_small">
                    <lightning-button
                        variant="brand"
                        label="Sign in with Salesforce"
                        onclick={handleLogin}
                        disabled={busy}
                        class="slds-m-right_x-small"
                    ></lightning-button>
                    <lightning-button
                        variant="destructive"
                        label="Sign out"
                        onclick={handleLogout}
                        disabled={busy}
                        class="slds-m-right_x-small"
                    ></lightning-button>
                    <lightning-button
                        variant="neutral"
                        label="Run sample SOQL"
                        onclick={handleSampleQuery}
                        disabled={busy}
                    ></lightning-button>
                </div>

                <template lwc:if={queryJson}>
                    <pre class="slds-m-top_medium slds-text-body_small slds-scrollable_y" style="max-height: 240px">{queryJson}</pre>
                </template>
            </div>
        </lightning-card>
    </div>
</template>
